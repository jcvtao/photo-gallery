<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accessible Photo Gallery</title>
  <link rel="stylesheet" href="css/gallery.css">
</head>
<body>

  <h1>Accessible Photo Gallery</h1>

  <p id="gallery-description">
    A collection of nature and landscape photos from the Tolima region of Colombia.
    Use your mouse or keyboard to explore each image.
  </p>

  <div id="gallery-wrapper">

    <div id="image">
      Hover over an image below to display here.
    </div>

    <div id="thumbnails">
      <img class="preview" alt="Chairs with a landscape in Anaime" src="images/chairs.jpeg">
      <img class="preview" alt="Palms in a workshop in Lérida" src="images/palms-workshop.jpeg">
      <img class="preview" alt="Pink Ocobos in bloom in Ibagué" src="images/pink-flowers.jpeg">
      <img class="preview" alt="Orange sunset in the mountains of Ibagué" src="images/sunset.jpeg">
      <img class="preview" alt="Yellow Ocobos tree in Ibagué" src="images/yellow-tree.jpeg">
      <img class="preview" alt="Group of cows in a pasture" src="images/cows-pasture.jpeg">
    </div>

  </div>

  <script src="js/gallery.js"></script>
</body>
</html>
